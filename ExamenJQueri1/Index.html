<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Notas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="javascript:void(0)">Gestión de Notas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mynavbar">
                
                <form class="d-flex mx-auto">
                    <button class="btn btn-primary" id="btn-add-element" type="button">Añadir Nota +</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <main class="col-md-9 col-lg-10 px-md-4">
                <div class="d-flex  flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Notas</h1>
                </div>
                <div class="row" id="form-elements">

                </div>
            </main>
        </div>
    </div>
    
    <div class="modal fade" id="elementModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Crear Nota</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></label>
                </div>

                <label type="text" class="w-75 mx-auto">Título Nota</label>
                <input type = "text" class="form-control w-75 mx-auto mb-2" id="element-title" placeholder = "Titulo..." >

                <div class="form-field w-75 mx-auto mb-2">
                    <label for="anchoNota" class="form-label w-75 mx-auto">Ancho Nota</label>
                    <select class="form-control" id="anchoNota">
                        <option>Elige una opción…</option>
                        <option value="col-2">Small</option>
                        <option value="col-4">Medium</option>
                        <option value="col-6">High</option>
                    </select>
                </div>

                <div class="form-field w-75 mx-auto mb-2">
                    <label for="colorNota" class="form-label w-75 mx-auto">Color Nota</label>
                    <select class="form-control" id="colorNota">
                        <option>Elige una opción…</option>
                        <option value="bg-danger">Rojo</option>
                        <option value="bg-success">Verde</option>
                        <option value="bg-primary">Azul</option>
                        <option value="bg-warning">Amarillo</option>
                    </select>
                </div>

                <button type="button" class="btn btn-success w-50 mx-auto mb-2" id="btn-element-save">Guardar</button>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"crossorigin="anonymous"></script>
    <script src="Index.js"></script>

</body>
</html>
