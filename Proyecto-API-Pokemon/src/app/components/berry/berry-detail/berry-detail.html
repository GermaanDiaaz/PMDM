@if (berry) {
  <div class="card mx-auto shadow" style="max-width: 400px;">
    <img 
      [src]="'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/' + berry.name + '-berry.png'" 
      class="card-img-top mx-auto mt-3" 
      [alt]="berry.name"
      style="width: 96px; height: 96px;"
    >
    <div class="card-body text-center">
      <h3 class="card-title text-capitalize fw-bold mb-3">{{ berry.name }}</h3>
      
      <p class="mb-1"><strong>Tamaño:</strong> {{ berry.size }} mm</p>
      <p class="mb-1"><strong>Potencia:</strong> {{ berry.firmness?.name }}</p>
      <p class="mb-3"><strong>Tiempo de crecimiento:</strong> {{ berry.growth_time }} horas</p>

      <a routerLink="/berry" class="btn btn-secondary w-100">Volver a la lista</a>
    </div>
  </div>
} @else {
  <div class="text-center mt-5">
    <p>Cargando datos de la Baya...</p>
  </div>
}
