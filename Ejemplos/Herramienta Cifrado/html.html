<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Palabras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        h1{
            color: rgb(0, 180, 180);
            font-size: 38pt;
            margin-bottom: 0;
        }
        .caja{
            width: 95%;
            border: 2px black solid;
            padding: 1%;
            margin: 10px auto 10px 0;
        }
        .resultados{
            width: 95%;
            border: 2px black solid;
            padding: 1%;
            margin: 10px auto 10px 0;
        }
        span{
            margin-right: 2%;
            color: rgb(48, 48, 48);
        }
        h3{
            margin-right: 1%;
        }
    </style>
</head>
<body>

    <h1 class="mx-3">Cifrado</h1>
    <h3 class="mx-3">Cifra lo q pongas</h3>
    
    <div class="caja justify-content-center mx-3">
        <textarea class="texto form-control" rows="5" placeholder="Escribe el texto a cifrar..."></textarea>           
    </div>
    
    <h3 class="mx-3">Texto Cifrado: </h3>
    <div class="resultados mx-3">
        <span class="cifrado fs-4"></span>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js.js"></script>
</body>
</html>
