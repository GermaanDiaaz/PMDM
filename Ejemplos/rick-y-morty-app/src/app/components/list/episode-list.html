<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Episodios de Rick and Morty</h2>
    <button (click)="cargarEpisodios()" class="btn btn-primary">
      Cargar Episodios
    </button>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    @for (episode of episodes; track episode.id) {
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <span class="badge bg-secondary mb-2">{{ episode.episode }}</span>
            <h5 class="card-title">{{ episode.name }}</h5>
            <p class="card-text text-muted mb-0">
              <small><strong>Estreno:</strong> {{ episode.air_date }}</small>
            </p>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12 text-center text-muted">
        <p>Haz clic en el botón para obtener los episodios.</p>
      </div>
    }
  </div>
</div>
